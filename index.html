<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ตื่นเช้า สั่งเครื่องดื่ม</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-4%20-11%2044%2044%22%3E%3Crect%20x%3D%22-4%22%20y%3D%22-11%22%20width%3D%2244%22%20height%3D%2244%22%20rx%3D%2210%22%20fill%3D%22%23F8B31B%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M2.4%205h9.2M1.8%2010.2h10.4%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M4.2%2010.2a2.8%202.8%200%200%200%205.6%200z%22%20fill%3D%22%23FFFFFF%22%20stroke%3D%22none%22%2F%3E%3Cpath%20d%3D%22M2.4%2015.4Q7%2020.6%2011.6%2015.4%22%20stroke-width%3D%222.4%22%2F%3E%3Cpath%20d%3D%22M24.4%205h9.2M23.8%2010.2h10.4%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M26.2%2010.2a2.8%202.8%200%200%200%205.6%200z%22%20fill%3D%22%23FFFFFF%22%20stroke%3D%22none%22%2F%3E%3Cpath%20d%3D%22M24.4%2015.4Q29%2020.6%2033.6%2015.4%22%20stroke-width%3D%222.4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: single phone-width column like a LINE LIFF page, sticky header + sticky checkout bar */
:root{
  --bg:#F6F2EC; --surface:#FFFFFF; --ink:#2A1E17; --muted:#7A6A5E; --line:#E6DDD2;
  --roast:#4A2E21; --pandan:#3F7A4E; --pandan-soft:#E4EFE6; --caramel:#C98A3E; --danger:#B4432F;
  --chat:#8CABD9; --bubble:#FFFFFF; --brand:#F8B31B;
  --f-display:"Mitr", "Noto Sans Thai", system-ui, sans-serif;
  --f-body:"IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17120F; --surface:#221B16; --ink:#F1E8DF; --muted:#AE9E90; --line:#3A2F27;
  --roast:#E9C9A8; --pandan:#7CC08E; --pandan-soft:#22362A; --caramel:#E0A55E; --danger:#E9806B;
  --chat:#2B3A52; --bubble:#2C241E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120F; --surface:#221B16; --ink:#F1E8DF; --muted:#AE9E90; --line:#3A2F27;
  --roast:#E9C9A8; --pandan:#7CC08E; --pandan-soft:#22362A; --caramel:#E0A55E; --danger:#E9806B;
  --chat:#2B3A52; --bubble:#2C241E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 140px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pandan);outline-offset:2px}

.liffbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:auto}
.hero{display:block;width:calc(100% + 32px);height:auto;max-width:none;margin-inline:-16px;aspect-ratio:1150/382;object-fit:cover;background:var(--brand)}
.liffbar .t{min-width:0}
.liffbar b{font-family:var(--f-display);font-weight:500;display:block;font-size:16px}
.liffbar small{color:var(--muted);font-size:12px}
.demo{margin-left:auto;font-size:11px;letter-spacing:.06em;color:var(--caramel);border:1px solid var(--caramel);padding:2px 8px;border-radius:99px;white-space:nowrap}

.tabs{display:flex;gap:18px;padding-block:12px 4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{color:var(--muted);text-decoration:none;padding-bottom:8px;white-space:nowrap;font-size:14px}
.tabs a.on{color:var(--ink);border-bottom:2px solid var(--roast);font-weight:600}
.banner{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}

section{padding-block:20px 4px;scroll-margin-top:60px}
section>h2{font-size:18px;margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--roast);color:var(--bg);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px 2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px}
.chip.on{border-color:var(--pandan);background:var(--pandan-soft);color:var(--pandan);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:10px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.slot b{display:block;font-variant-numeric:tabular-nums}
.slot small{color:var(--muted);font-size:12px}
.slot.on{border-color:var(--pandan);box-shadow:inset 0 0 0 1px var(--pandan)}
.slot:disabled,.chip:disabled{opacity:.45;cursor:not-allowed}
.asap{margin-top:10px;border:1px solid var(--pandan);background:var(--pandan-soft);border-radius:12px;padding:10px 12px}
.asap b{display:block;color:var(--pandan)}
.asap small{color:var(--muted);font-size:12px}
.place{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}

label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
select,input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
input:disabled{background:var(--bg);color:var(--muted);cursor:not-allowed}
.rec{font-size:11px;color:var(--pandan);background:var(--pandan-soft);border-radius:99px;padding:1px 8px;font-weight:600}
textarea{resize:vertical;min-height:64px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.rank{position:absolute;top:10px;left:10px;font-size:11px;background:var(--roast);color:var(--bg);padding:1px 8px;border-radius:99px;z-index:1}
.glassbox{aspect-ratio:1;max-width:100%;border-radius:12px;background:radial-gradient(circle at 50% 30%, color-mix(in srgb,var(--caramel) 16%,var(--surface)), var(--bg));display:grid;place-items:center;overflow:hidden}
.glassbox img{width:100%;height:100%;object-fit:cover}
.glass{width:46%;height:70%;border-radius:4px 4px 14px 14px;border:2px solid color-mix(in srgb,var(--ink) 18%,transparent);position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,90% 100%,10% 100%)}
.glass i{position:absolute;left:0;right:0;bottom:0}
.card h3{font-size:15px}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.price{font-weight:600;font-variant-numeric:tabular-nums}
.add{width:34px;height:34px;border-radius:50%;border:0;background:var(--pandan);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li .glassbox{width:56px;flex:none}
.li .t{flex:1;min-width:0}
.li small{color:var(--muted);display:block;font-size:12px}
.cat{font-size:13px;color:var(--muted);letter-spacing:.04em;margin:16px 0 4px}

.pay{display:flex;gap:8px;flex-wrap:wrap}
.pay button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-size:14px}
.pay button.on{background:var(--roast);color:var(--bg);border-color:var(--roast)}
.pay button:disabled{opacity:.45;cursor:not-allowed}
.code{display:flex;gap:8px}
.code input{flex:1;min-width:0;text-transform:uppercase}
.code button{border:0;border-radius:12px;background:var(--roast);color:var(--bg);padding:0 16px;white-space:nowrap}
.code button:disabled{opacity:.5}
.ok{font-size:12px;color:var(--pandan);margin-top:6px}
.err{font-size:12px;color:var(--danger);margin-top:6px}
.stampcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stampcard small{color:var(--muted);font-size:12px}

.sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.sum .it{display:flex;gap:10px;align-items:flex-start;padding-block:8px;border-bottom:1px dashed var(--line)}
.sum .it .t{flex:1;min-width:0}
.sum .it small{display:block;color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);line-height:1}
.kv{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;padding-top:6px;font-size:14px}
.kv.total{font-family:var(--f-display);font-size:18px;color:var(--roast);padding-top:10px}
.kv .neg{color:var(--pandan)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:448px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .t{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.bar .t b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.bar .err{max-width:448px;margin:0 auto 8px;font-size:13px}
.cta{border:0;border-radius:14px;background:var(--pandan);color:#fff;padding:13px 22px;font-family:var(--f-display);font-size:16px}
.cta:disabled{opacity:.4;cursor:not-allowed}

.sheet-bg{position:fixed;inset:0;background:rgba(20,12,8,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.sheet h3{font-size:20px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.opt input{width:18px;height:18px;accent-color:var(--pandan);flex:none}
.opt .p{margin-left:auto;color:var(--muted);font-size:13px}
.opt.off{color:var(--muted);opacity:.55;cursor:not-allowed}
.oh{font-weight:600;margin-top:14px;font-size:14px}
.oh small{color:var(--muted);font-weight:400}

.state{min-height:80vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.state p{max-width:300px;margin:14px auto}
.spin{width:30px;height:30px;margin:auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pandan);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LINE chat confirmation */
.chat{background:var(--chat);min-height:100vh;margin-inline:-16px;margin-bottom:-140px;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}
.chathead{display:flex;align-items:center;gap:8px;color:#fff;font-size:14px}
.chathead .logo{width:30px;height:30px}
.chathead .logo svg{width:22px}
.flex{background:var(--bubble);border-radius:18px;overflow:hidden;max-width:320px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.flex .hd{background:var(--roast);color:var(--bg);padding:14px 16px}
.flex .hd small{opacity:.8;display:block;font-size:12px}
.flex .hd b{font-family:var(--f-display);font-size:17px;font-weight:500}
.flex .bd{padding:12px 16px;font-size:13px}
.flex .bd .kv{font-size:13px}
.flex .bd hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
.flex .ft{padding:0 16px 14px}
.flex .ft .qr{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.qrimg{width:96px;height:96px;flex:none;background:#fff;border-radius:6px;padding:4px}
.msg{background:var(--bubble);border-radius:18px;padding:10px 14px;max-width:300px;font-size:14px}
.again{align-self:center;margin-top:8px;border:0;background:var(--surface);border-radius:99px;padding:10px 18px;font-size:14px}
.stamp{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stamp i{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--caramel)}
.stamp i.on{background:var(--caramel);border-style:solid}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="demo.js"></script>
<script>
const CFG = window.APP_CONFIG || {};
const DEMO = !CFG.GAS_URL || new URLSearchParams(location.search).has("demo");
let C = null;        // shop config from the backend: menu, days/slots, options
let idToken = null;  // LIFF ID token, verified by the backend on every call

const S = {
  mode:"deliver", day:0, slot:null, loc:"", drop:"", locNote:"", phone:"", note:"",
  code:"", applied:null, codeErr:"", codeBusy:false, pay:"promptpay", useFree:false,
  cart:[], tab:"round", sheet:null, done:null, busy:false, err:"",
  cust:{name:"", orders:0, stamps:0, freeCups:0}
};
const $ = s=>document.querySelector(s);
const baht = n=>n.toLocaleString("th-TH")+" ฿";
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const glass = m=>{
  if(m.img) return `<div class="glassbox"><img src="${esc(m.img)}" alt="" loading="lazy"></div>`;
  let b=0; return `<div class="glassbox"><div class="glass">${m.layers.map(([c,h])=>{const s=`<i style="background:${esc(c)};bottom:${b}%;height:${h}%"></i>`;b+=h;return s}).join("")}</div></div>`;
};
const lineTotal = l=>(l.m.price + l.extras.reduce((a,e)=>a+e[1],0))*l.qty;
const subtotal = ()=>S.cart.reduce((a,l)=>a+lineTotal(l),0);
const freeDisc = ()=>S.useFree && S.cust.freeCups>0 && S.cart.length ? Math.max(...S.cart.map(l=>l.m.price)) : 0;
const discount = ()=>Math.min(subtotal(), freeDisc() + (S.applied? S.applied.amount : 0));
const fee = ()=>S.mode==="deliver"? C.deliveryFee : 0;
const total = ()=>Math.max(0, subtotal()-discount()+fee());
const count = ()=>S.cart.reduce((a,l)=>a+l.qty,0);
const firstOrder = ()=>!S.cust.orders;
const cashLocked = ()=>C.firstOrderPromptPayOnly && firstOrder();
const phoneOk = ()=>/^0\d{8,9}$/.test(S.phone.replace(/\D/g,""));
const dayOpen = d=>d.asap? d.open : d.slots.some(x=>x.open);
const roomRequired = ()=>S.mode==="deliver" && C.roomRequiredFor.includes(S.drop);
const roomEnabled = ()=>!C.dropOptions.length || roomRequired(); // e.g. food locker → no room number
function missing(){
  const day = C.days[S.day];
  if(!C.acceptingOrders) return "ร้านปิดรับชั่วคราว";
  if(!S.cart.length) return "ยังไม่ได้เลือกเครื่องดื่ม";
  if(!day || !dayOpen(day)) return "วันนี้ปิดรับแล้ว";
  if(!day.asap && !S.slot) return "ยังไม่ได้เลือกรอบ";
  if(S.mode==="deliver" && !S.loc) return "ยังไม่ได้เลือกสถานที่ส่ง";
  if(roomRequired() && !S.locNote.trim()) return "กรอกเลขห้องด้วยนะ";
  if(!phoneOk()) return "กรอกเบอร์โทรด้วยนะ";
  return "";
}
const ready = ()=>!missing() && !S.busy;

// ---------- backend ----------
async function api(action, data={}){
  if(DEMO) return window.DemoApi(action, data);
  let res;
  try{ res = await fetch(CFG.GAS_URL, {method:"POST", body:JSON.stringify({action, idToken, ...data})}); }
  catch(_){ throw new Error("เชื่อมต่อร้านไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่"); }
  const j = await res.json().catch(()=>({ok:false, error:"ร้านตอบกลับผิดพลาด ลองใหม่อีกครั้ง"}));
  if(!j.ok) throw new Error(j.error || "เกิดข้อผิดพลาด");
  return j;
}

async function boot(){
  renderState("กำลังเปิดร้าน…", true);
  try{
    if(!DEMO){
      await liff.init({liffId:CFG.LIFF_ID, withLoginOnExternalBrowser:true});
      if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
      idToken = liff.getIDToken();
      if(!idToken) throw new Error("LIFF ยังไม่ได้เปิดสิทธิ์ openid (ตั้งค่าใน LINE Developers)");
    }
    const r = await api("init");
    applyConfig(r.config);
    applyCustomer(r.customer);
    document.title = C.shopName + " สั่งเครื่องดื่ม";
    render();
  }catch(e){
    renderState(e.message || String(e), false, true);
  }
}

function applyConfig(cfg){
  C = cfg;
  const firstOpen = C.days.findIndex(dayOpen);
  if(!C.days[S.day] || (!dayOpen(C.days[S.day]) && firstOpen>=0)) S.day = Math.max(0, firstOpen);
  const d = C.days[S.day];
  if(S.slot && (!d || d.asap || !d.slots.some(x=>x.time===S.slot && x.open))){
    if(d && !d.asap) S.err = S.err || "รอบที่เลือกปิดรับแล้ว เลือกรอบใหม่อีกครั้ง";
    S.slot = null;
  }
  if(!C.allowPickup) S.mode = "deliver";
  if(C.locations.length===1) S.loc = C.locations[0];
  if(!C.dropOptions.includes(S.drop)) S.drop = C.dropOptions[0] || "";
  if(!C.enableStamps) S.useFree = false;
  if(!C.enableCodes) S.applied = null;
  // re-link cart lines to the fresh menu; drop sold-out drinks
  S.cart = S.cart.filter(l=>C.menu.some(m=>m.id===l.m.id)).map(l=>({...l, m:C.menu.find(m=>m.id===l.m.id)}));
}
function applyCustomer(c){
  S.cust = c;
  S.phone = c.phone || "";
  if(c.lastMode==="pickup" && C.allowPickup) S.mode = "pickup";
  if(C.locations.includes(c.lastLoc)){ S.loc = c.lastLoc; S.locNote = c.lastLocNote || ""; }
  if(C.dropOptions.includes(c.lastDrop)) S.drop = c.lastDrop;
}

// ---------- views ----------
// Logo mark: the two sleepy eyes from the ตื่นเช้า wordmark
function logoSvg(){return `<svg viewBox="0 0 36 22" fill="none" stroke="#FFFFFF" stroke-linecap="round" aria-hidden="true"><path d="M2.4 5h9.2M1.8 10.2h10.4" stroke-width="2"/><path d="M4.2 10.2a2.8 2.8 0 0 0 5.6 0z" fill="#FFFFFF" stroke="none"/><path d="M2.4 15.4Q7 20.6 11.6 15.4" stroke-width="2.4"/><path d="M24.4 5h9.2M23.8 10.2h10.4" stroke-width="2"/><path d="M26.2 10.2a2.8 2.8 0 0 0 5.6 0z" fill="#FFFFFF" stroke="none"/><path d="M24.4 15.4Q29 20.6 33.6 15.4" stroke-width="2.4"/></svg>`}
function renderState(msg, spin, retry){
  $("#app").innerHTML = `<div class="state"><div>${spin?'<div class="spin"></div>':`<div class="logo" style="margin:auto">${logoSvg()}</div>`}<p>${esc(msg)}</p>${retry?'<button class="again" onclick="location.reload()">ลองใหม่</button>':''}</div></div>`;
}
const stampDots = ()=>`<div class="stamp">${Array.from({length:C.stampGoal},(_,i)=>`<i class="${i<S.cust.stamps?'on':''}"></i>`).join("")}</div>`;

function render(){
  if(S.done) return renderDone();
  const best = C.menu.filter(m=>m.best).sort((a,b)=>a.best-b.best).slice(0,4);
  const cats = [...new Set(C.menu.map(m=>m.cat))];
  const day = C.days[S.day];
  const deliver = S.mode==="deliver";
  $("#app").innerHTML = `
  <div class="liffbar"><div class="logo">${logoSvg()}</div><div class="t"><b>${esc(C.shopName)}</b><small>${esc(S.cust.name?`สวัสดีคุณ ${S.cust.name}`:C.shopSub)}</small></div>${DEMO?'<span class="demo">ตัวอย่าง</span>':''}</div>
  <img class="hero" src="brand/banner.png" alt="TUEN_CHAO ตื่นเช้า" width="1150" height="382">
  <nav class="tabs">${[["round","รอบส่ง"],...(best.length?[["best","ขายดีที่สุด"]]:[]),["menu","เมนูทั้งหมด"],["checkout","ยืนยันออเดอร์"]].map(([id,t])=>`<a href="#${id}" class="${S.tab===id?'on':''}" data-tab="${id}">${t}</a>`).join("")}</nav>
  ${C.acceptingOrders?'':`<div class="banner">${esc(C.closedMessage)}</div>`}

  <section id="round">
    <h2>วันและรอบส่ง</h2>
    ${C.allowPickup?`<div class="seg"><button data-mode="deliver" class="${deliver?'on':''}">จัดส่ง</button><button data-mode="pickup" class="${!deliver?'on':''}">รับที่ร้าน</button></div>`:''}
    ${day?`<div class="chips">${C.days.map((d,i)=>`<button class="chip ${S.day===i?'on':''}" data-day="${i}" ${dayOpen(d)?'':'disabled'}>${esc(d.rel?d.rel+' · '+d.label:d.label)}</button>`).join("")}</div>
    ${day.asap
      ?`<div class="asap"><b>${deliver?'ส่งทันทีที่เครื่องดื่มพร้อม':'มารับได้เมื่อร้านทักไลน์'}</b><small>${esc(day.note)}${day.note?' · ':''}ไม่ต้องเลือกเวลา</small></div>`
      :`<div class="slots">${day.slots.map(x=>`<button class="slot ${S.slot===x.time?'on':''}" data-slot="${esc(x.time)}" ${x.open?'':'disabled'}><b>${esc(x.time)} น.</b><small>${esc(x.note)}</small></button>`).join("")}</div>`}`
    :`<p class="hint">ช่วงนี้ยังไม่มีรอบเปิดรับ</p>`}
    ${deliver?`
    <label class="f" for="loc">สถานที่ส่ง <span style="color:var(--danger)">*</span></label>
    <select id="loc">${C.locations.length>1?'<option value="">— เลือกสถานที่ —</option>':''}${C.locations.map(l=>`<option ${S.loc===l?'selected':''}>${esc(l)}</option>`).join("")}</select>
    ${C.dropOptions.length?`<label class="f">วิธีส่ง</label>
    <div class="seg">${C.dropOptions.map(o=>`<button data-drop="${esc(o)}" class="${S.drop===o?'on':''}">${esc(o)}</button>`).join("")}</div>`:''}
    <label class="f" for="locNote">${!C.dropOptions.length?'จุดรับเพิ่มเติม':roomEnabled()?'เลขห้อง <span style="color:var(--danger)">*</span>':'เลขห้อง'}</label>
    ${roomEnabled()
      ?`<input id="locNote" maxlength="100" placeholder="${C.dropOptions.length?'เช่น อาคาร A ห้อง 1204':'เช่น ห้อง 204 / ชั้น 2 หน้าลิฟต์'}" value="${esc(S.locNote)}">`
      :`<input id="locNote" disabled placeholder="ไม่ต้องกรอกเมื่อส่งที่${esc(S.drop)}">`}`
    :`<p class="hint">${day&&day.asap?'ร้านจะทักไลน์เมื่อเครื่องดื่มพร้อม':'มารับที่ร้านตามเวลาที่เลือก ร้านจะทักไลน์เมื่อเครื่องดื่มพร้อม'}</p>`}
  </section>

  ${best.length?`<section id="best"><h2>ขายดีที่สุด</h2>
    <div class="grid">${best.map((m,i)=>`<div class="card"><span class="rank">อันดับ ${i+1}</span>${glass(m)}<h3>${esc(m.name)}</h3><div class="row"><span class="price">${baht(m.price)}</span><button class="add" data-add="${esc(m.id)}" aria-label="เพิ่ม ${esc(m.name)}">+</button></div></div>`).join("")}</div>
  </section>`:''}

  <section id="menu"><h2>เมนูทั้งหมด</h2>
    ${cats.map(c=>`<div class="cat">${esc(c)}</div><div class="list">${C.menu.filter(m=>m.cat===c).map(m=>`<div class="li">${glass(m)}<div class="t"><b>${esc(m.name)}</b><small>${baht(m.price)}</small></div><button class="add" data-add="${esc(m.id)}" aria-label="เพิ่ม ${esc(m.name)}">+</button></div>`).join("")}</div>`).join("")}
  </section>

  <section id="checkout"><h2>ติดต่อ & ชำระเงิน</h2>
    <label class="f" for="phone">เบอร์โทร <span style="color:var(--danger)">*</span></label>
    <input id="phone" inputmode="tel" autocomplete="tel" placeholder="0812345678" value="${esc(S.phone)}">
    <p class="hint">ถ้าหาที่ส่งไม่เจอ ร้านจะโทรหาเบอร์นี้</p>
    ${C.enableCodes?`<label class="f" for="code">โค้ดส่วนลด</label>
    <div class="code"><input id="code" placeholder="${firstOrder()?'ลูกค้าใหม่ลองใส่ NEW10':'ใส่โค้ด'}" value="${esc(S.applied?S.applied.code:S.code)}" ${S.applied?'disabled':''}><button id="applyCode" ${S.codeBusy?'disabled':''}>${S.applied?'ยกเลิก':S.codeBusy?'กำลังตรวจ…':'ใช้โค้ด'}</button></div>
    ${S.applied?`<p class="ok">✓ ${esc(S.applied.label)}</p>`:S.codeErr?`<p class="err">${esc(S.codeErr)}</p>`:''}`:''}
    ${C.enableStamps?`<label class="f">บัตรสะสมแต้ม</label>
    <div class="stampcard">${stampDots()}<small>${S.cust.stamps}/${C.stampGoal} แก้ว · ครบ ${C.stampGoal} แก้วรับฟรี 1 แก้ว</small>
      ${S.cust.freeCups>0?`<label class="opt"><input type="checkbox" id="useFree" ${S.useFree?'checked':''}> ใช้สิทธิ์แก้วฟรี (มี ${S.cust.freeCups} สิทธิ์)<span class="p">ฟรีแก้วที่แพงที่สุด</span></label>`:''}
    </div>`:''}
    <label class="f">ชำระเงิน</label>
    <div class="pay"><button data-pay="promptpay" class="${S.pay==='promptpay'?'on':''}">โอนพร้อมเพย์</button><button data-pay="cash" class="${S.pay==='cash'?'on':''}" ${cashLocked()?'disabled':''}>เงินสดปลายทาง</button></div>
    <p class="hint">${cashLocked()?'ออเดอร์แรกชำระผ่านพร้อมเพย์ก่อน ครั้งถัดไปเลือกเงินสดปลายทางได้':'เลือกได้ทั้งสองแบบ'}</p>
    <label class="f" for="note">ฝากถึงร้าน</label>
    <textarea id="note" maxlength="300" placeholder="ไม่บังคับ">${esc(S.note)}</textarea>
  </section>

  <section><h2>สรุปรายการ</h2>
    <div class="sum">
      ${S.cart.length? S.cart.map((l,i)=>`<div class="it"><div class="t"><b>${esc(l.m.name)}</b><small>${esc([l.sweet,...l.extras.map(e=>e[0]),l.note].filter(Boolean).join(" · "))}</small></div><div class="qty"><button data-dec="${i}" aria-label="ลด">−</button><span>${l.qty}</span><button data-inc="${i}" aria-label="เพิ่ม">+</button></div><span class="price" style="min-width:52px;text-align:right">${lineTotal(l)}</span></div>`).join("") : `<div class="empty">ยังไม่มีเครื่องดื่มในตะกร้า กด + ที่เมนูด้านบน</div>`}
      <div class="kv"><span>${deliver?'ส่ง':'รับ'} ${day?esc(day.rel||day.label):''}</span><span>${day&&day.asap?'เร็วที่สุด':S.slot? esc(S.slot)+' น.':'ยังไม่เลือกรอบ'}</span></div>
      ${deliver?`<div class="kv"><span>สถานที่</span><span style="text-align:right">${esc([S.loc||'—',S.drop,roomEnabled()?S.locNote.trim():''].filter(Boolean).join(' · '))}</span></div>
      <div class="kv"><span>ค่าส่ง</span><span>${C.deliveryFee?baht(C.deliveryFee):'ฟรี'}</span></div>`:''}
      ${discount()?`<div class="kv"><span>ส่วนลด${S.applied?' '+esc(S.applied.code):''}${freeDisc()?' + แก้วฟรี':''}</span><span class="neg">−${discount()}</span></div>`:''}
      <div class="kv total"><span>ยอดชำระ</span><span>${baht(total())}</span></div>
    </div>
  </section>

  <div class="bar" id="bar">${barHtml()}</div>
  ${S.sheet? sheetHtml():''}`;
  bind();
}

function barHtml(){
  const miss = missing();
  return `${S.err?`<p class="err">${esc(S.err)}</p>`:''}<div class="in"><div class="t">${S.cart.length&&!miss?count()+' แก้ว':esc(miss)}<b>${baht(total())}</b></div><button class="cta" id="submit" ${ready()?'':'disabled'}>${S.busy?'กำลังส่ง…':'สั่งเครื่องดื่ม'}</button></div>`;
}
function refreshBar(){ $("#bar").innerHTML = barHtml(); $("#submit").onclick = submit; }

const sweetOk = (m,s)=>!(m.sweetOff||[]).includes(s);
const defaultSweet = m=>sweetOk(m,C.sweetRecommended) && C.sweetness.includes(C.sweetRecommended)? C.sweetRecommended : C.sweetness.find(s=>sweetOk(m,s));
function sheetHtml(){
  const m = C.menu.find(x=>x.id===S.sheet.id);
  return `<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-label="${esc(m.name)}">
    <div style="display:flex;gap:12px;align-items:center"><div style="width:72px">${glass(m)}</div><div><h3>${esc(m.name)}</h3><span class="price">${baht(m.price)}</span></div></div>
    ${C.sweetness.length?`<div class="oh">ความหวาน <small>จำเป็น · เลือก 1 อย่าง</small></div>
    ${C.sweetness.map(s=>sweetOk(m,s)
      ?`<label class="opt"><input type="radio" name="sw" value="${esc(s)}" ${s===defaultSweet(m)?'checked':''}> ${esc(s)}${s===C.sweetRecommended?' <span class="rec">แนะนำ</span>':''}</label>`
      :`<label class="opt off"><input type="radio" disabled> ${esc(s)}<span class="p">ไม่มีสำหรับเมนูนี้</span></label>`).join("")}`:''}
    ${C.extras.length?`<div class="oh">เพิ่มเติม <small>ไม่บังคับ</small></div>
    ${C.extras.map(([n,p],i)=>!C.extrasOff.includes(n)
      ?`<label class="opt"><input type="checkbox" name="ex" value="${i}"> ${esc(n)}<span class="p">+${p}</span></label>`
      :`<label class="opt off"><input type="checkbox" disabled> ${esc(n)}<span class="p">ไม่พร้อมให้บริการ</span></label>`).join("")}`:''}
    <label class="f" for="itemNote">หมายเหตุถึงร้าน</label><input id="itemNote" maxlength="100" placeholder="เช่น น้ำแข็งน้อย">
    <div style="display:flex;gap:10px;margin-top:16px"><button class="cta" style="background:var(--line);color:var(--ink)" id="sheetClose">ยกเลิก</button><button class="cta" style="flex:1" id="sheetAdd">ใส่ตะกร้า</button></div>
  </div></div>`;
}

function bind(){
  document.querySelectorAll("[data-tab]").forEach(a=>a.onclick=e=>{e.preventDefault();S.tab=a.dataset.tab;document.getElementById(S.tab).scrollIntoView({behavior:"smooth",block:"start"});document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===a))});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;render()});
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{S.day=+b.dataset.day;if(S.slot&&!C.days[S.day].slots.some(x=>x.time===S.slot&&x.open))S.slot=null;render()});
  document.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{S.drop=b.dataset.drop;render()});
  document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{S.slot=b.dataset.slot;S.err="";render()});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{S.sheet={id:b.dataset.add};render()});
  document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{S.cart[+b.dataset.inc].qty++;render()});
  document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{const l=S.cart[+b.dataset.dec];l.qty--;if(!l.qty)S.cart.splice(+b.dataset.dec,1);render()});
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{S.pay=b.dataset.pay;render()});
  const loc=$("#loc"); if(loc) loc.onchange=()=>{S.loc=loc.value;render()};
  const ln=$("#locNote"); if(ln) ln.oninput=()=>{S.locNote=ln.value;refreshBar()};
  $("#phone").oninput=e=>{S.phone=e.target.value;refreshBar()};
  $("#note").oninput=e=>S.note=e.target.value;
  const code=$("#code"); if(code) code.oninput=()=>S.code=code.value;
  const uf=$("#useFree"); if(uf) uf.onchange=()=>{S.useFree=uf.checked;render()};
  const ac=$("#applyCode"); if(ac) ac.onclick=applyCode;
  $("#submit").onclick=submit;
  if(S.sheet){
    $("#sheetClose").onclick=()=>{S.sheet=null;render()};
    $("#sheetBg").onclick=e=>{if(e.target.id==="sheetBg"){S.sheet=null;render()}};
    $("#sheetAdd").onclick=()=>{
      const m=C.menu.find(x=>x.id===S.sheet.id);
      const sweet=document.querySelector('input[name=sw]:checked')?.value||"";
      const extras=[...document.querySelectorAll('input[name=ex]:checked')].map(i=>C.extras[+i.value]);
      const note=$("#itemNote").value.trim();
      const same=S.cart.find(l=>l.m.id===m.id&&l.sweet===sweet&&l.note===note&&JSON.stringify(l.extras)===JSON.stringify(extras));
      same? same.qty++ : S.cart.push({m,sweet,extras,note,qty:1});
      S.sheet=null; render();
    };
  }
}

async function applyCode(){
  if(S.applied){ S.applied=null; S.code=""; S.codeErr=""; return render(); }
  const c = S.code.trim().toUpperCase();
  if(!c){ S.codeErr="กรอกโค้ดก่อนกดใช้"; return render(); }
  S.codeBusy=true; S.codeErr=""; render();
  try{ S.applied = (await api("checkCode",{code:c})).code; }
  catch(e){ S.codeErr = e.message; }
  S.codeBusy=false; render();
}

async function submit(){
  if(!ready()) return;
  S.busy=true; S.err=""; refreshBar();
  const day=C.days[S.day];
  try{
    const r = await api("order", {order:{
      mode:S.mode, date:day.date, slot:day.asap?"":S.slot,
      loc:S.mode==="deliver"?S.loc:"", drop:S.mode==="deliver"?S.drop:"", locNote:roomEnabled()?S.locNote.trim():"",
      phone:S.phone, note:S.note.trim(), pay:S.pay, code:S.applied?S.applied.code:"", useFree:!!freeDisc(),
      items:S.cart.map(l=>({id:l.m.id, qty:l.qty, sweet:l.sweet, extras:l.extras.map(e=>e[0]), note:l.note}))
    }});
    S.done = r.order;
    S.cust = {...S.cust, ...r.customer};
    if(C.receiptMode==="reply" && !DEMO) sendConfirm(r.order.no);
    window.scrollTo(0,0);
  }catch(e){
    S.err = e.message;
    // slots / menu / codes may have changed under us — refresh but keep the cart
    try{ const r = await api("init"); applyConfig(r.config); S.cust = {...S.cust, ...r.customer}; }catch(_){}
  }
  S.busy=false; render();
}

// receiptMode = reply: the customer "says" the order number in chat and the bot replies with the receipt (free).
// If that is not possible (opened outside LINE), ask the backend to push it instead.
async function sendConfirm(no){
  try{
    if(!liff.isInClient()) throw 0;
    await liff.sendMessages([{type:"text", text:"ยืนยันออเดอร์ "+no}]);
  }catch(_){
    api("pushReceipt",{orderNo:no}).catch(()=>{});
  }
}

function renderDone(){
  const o=S.done;
  const qr = o.pay==="promptpay" && C.promptpay && o.total>0;
  $("#app").innerHTML = `<div class="chat">
    <div class="chathead"><div class="logo">${logoSvg()}</div><b>${esc(C.shopName)}</b></div>
    <div class="msg">ขอบคุณที่สั่งนะคะ ☕ ร้านได้รับออเดอร์แล้ว ใบสั่งซื้อส่งเข้าแชท LINE ของร้านด้วย</div>
    <div class="flex">
      <div class="hd"><small>ใบสั่งซื้อ</small><b>${esc(o.no)}</b></div>
      <div class="bd">
        <div class="kv"><span>รอบ</span><span>${esc(o.when)}</span></div>
        <div class="kv"><span>สถานที่</span><span style="text-align:right;max-width:60%">${esc(o.where)}</span></div>
        <hr>
        ${o.items.map(l=>`<div class="kv"><span>${l.qty}× ${esc(l.name)}${l.opts?`<br><small style="color:var(--muted)">${esc(l.opts)}</small>`:''}</span><span>${l.total}</span></div>`).join("")}
        <hr>
        <div class="kv"><span>ยอดรวม</span><span>${o.subtotal} บาท</span></div>
        ${o.discount?`<div class="kv"><span>ส่วนลด</span><span style="color:var(--pandan)">−${o.discount} บาท</span></div>`:''}
        ${o.deliveryFee?`<div class="kv"><span>ค่าส่ง</span><span>${o.deliveryFee} บาท</span></div>`:''}
        <div class="kv total"><span>ยอดชำระ</span><span>${o.total} บาท</span></div>
      </div>
      <div class="ft">${qr
        ?`<div class="qr"><img class="qrimg" src="https://promptpay.io/${esc(C.promptpay)}/${o.total}.png" alt="QR พร้อมเพย์ ${o.total} บาท"><div>สแกนจ่ายพร้อมเพย์ ${o.total} บาท<br>แล้วส่งสลิปในแชทร้านได้เลย</div></div>`
        :`<div class="qr">${o.total<=0?'ไม่มียอดที่ต้องชำระ':o.pay==='cash'?'ชำระเงินสดตอนรับเครื่องดื่ม':'ร้านจะส่งช่องทางชำระเงินให้ในแชท'}</div>`}</div>
    </div>
    ${C.enableStamps?`<div class="msg">บัตรสะสมแต้ม: ${S.cust.stamps}/${C.stampGoal} แก้ว ${S.cust.freeCups?`· 🎁 มีสิทธิ์แก้วฟรี ${S.cust.freeCups} แก้ว`:`ครบ ${C.stampGoal} แก้วรับฟรี 1 แก้ว`}
      ${stampDots()}</div>`:''}
    ${!DEMO && liff.isInClient()?'<button class="again" id="close">กลับไปที่แชท</button>':''}
    <button class="again" id="again">สั่งอีกรอบ</button>
  </div>`;
  const cl=$("#close"); if(cl) cl.onclick=()=>liff.closeWindow();
  $("#again").onclick=async()=>{
    Object.assign(S,{done:null,cart:[],applied:null,code:"",codeErr:"",useFree:false,pay:"promptpay",note:"",slot:null,err:""});
    render();
    try{ const r=await api("init"); applyConfig(r.config); S.cust={...S.cust,...r.customer}; render(); }catch(_){}
  };
}

boot();
</script>
</body>
</html>
